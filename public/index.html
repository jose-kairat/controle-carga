<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Carga</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

    --ink:#141414;
    --ink-soft:#1C1C1C;
    --ink-card:#242424;
    --chalk:#F5F5F5;
    --chalk-card:#FFFFFF;
    --turf:#E31E24;
    --turf-light:#FF6B62;
    --zone-good:#3FA34D;
    --amber:#E8B923;
    --flare:#B0201F;
    --steel:#3C6B8C;
    --coldzone:#5B7C8D;
    --line-on-dark:rgba(255,255,255,0.14);
    --line-on-light:rgba(20,20,20,0.14);
    --text-on-dark:#FFFFFF;
    --text-on-dark-dim:#B3B3B3;
    --text-on-light:#141414;
    --text-on-light-dim:#666666;
  }

    color:var(--text-on-light);

  .status-row .lbl{font-family:'Barlow Condensed'; text-transform:uppercase; font-size:15px; letter-spacing:0.02em;}

<body>
<div id="app"></div>
<script>
/* ============================= SELF-PUBLISH TEMPLATE CAPTURE =============================
   Must run BEFORE any DOM mutation so it faithfully captures the served source.
   Used later to regenerate the full document (with an updated DOC_STATE) for artifact.publish(). */
/* ============================= DOC_STATE (loaded from the backend) =============================
   Everything the app needs: athlete/staff names, login password hashes, and each athlete's
   wellness/load history (`entries`). Backed by a real database (Cloudflare D1) behind the
   /api/* endpoints below — no artifact "publish", no reload, no share-link pinning. */
let DOC_STATE = {"roster":[],"staffRoster":[],"entries":{}};

/* ============================= PERSISTENCE (backend API) =============================
   loadDocState() / refreshDocState() / publishDocState() keep the same names and shapes the
   rest of the app already calls, so every screen and action handler below is unchanged —
   only what happens inside these functions is new. */
async function loadDocState(){
  try{
    const res = await fetch('/api/state', {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(data && typeof data==='object') DOC_STATE = data;
    }
  }catch(e){ /* network hiccup — keep whatever DOC_STATE already holds, retry next load */ }
}
/* Staff-facing screens (dashboard, roster manage, athlete detail) are opened long after page
   load and need whatever the athletes most recently submitted — which may have been saved from a
   completely different device/tab, so it never reaches this tab's in-memory DOC_STATE on its own.
   Call this right before rendering any of those screens. */
async function refreshDocState(){
  await loadDocState();
  STATE.roster = DOC_STATE.roster || [];
  STATE.staffRoster = DOC_STATE.staffRoster || [];
}
/* Roster/staff/password changes are infrequent and staff-only, so they're synced as a full
   replace of the roster table — simplest correct option, matching how these call sites already
   mutate STATE.roster/staffRoster in place before calling this. Athlete wellness entries are
   NOT part of this call (see submitEntry/clearAthleteEntries below), which is what removes the
   old lost-update risk between two athletes submitting around the same time. */
async function publishDocState(){
  try{
    const res = await fetch('/api/roster-sync', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({roster: STATE.roster, staffRoster: STATE.staffRoster})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    DOC_STATE.roster = STATE.roster; DOC_STATE.staffRoster = STATE.staffRoster;
    return true;
  }catch(e){
    console.error('save failed', e);
    showToast('Não deu para salvar agora. Tente de novo em instantes.');
    return false;
  }
}
/* ============================= ATHLETE SUBMISSION (direct save) =============================
   Athletes are on their phones and need this to be one tap, no leaving the app. Each submission
   is a single atomic upsert on the backend (merged onto any existing row for that date), so two
   different athletes — or the same athlete's pré and pós-treino answers — never clobber each
   other. History is pruned server-side to a rolling window well beyond what the charts use. */
function upsertEntry(name, date, patch){
  // Local optimistic update only, so the UI reflects the change immediately; the backend
  // performs the authoritative merge independently in /api/entry.
  if(!DOC_STATE.entries) DOC_STATE.entries = {};
  if(!DOC_STATE.entries[name]) DOC_STATE.entries[name] = [];
  const list = DOC_STATE.entries[name];
  let e = list.find(x=>x.date===date);
  if(!e){ e = {date}; list.push(e); }
  Object.assign(e, patch);
}
async function submitEntry(name, date, patch){
  // Stashed so a page reload before the request finishes doesn't lose the athlete's answer —
  // recovered and retried once from init().
  try{ sessionStorage.setItem('cc_pending_submit', JSON.stringify({name, date, patch, ts: Date.now()})); }catch(e){}
  upsertEntry(name, date, patch);
  try{
    const res = await fetch('/api/entry', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, date, patch})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    try{ sessionStorage.removeItem('cc_pending_submit'); }catch(e){}
    return true;
  }catch(e){
    console.error('submit failed', e);
    return false;
  }
}
async function recoverPendingSubmit(){
  let stashed;
  try{ stashed = JSON.parse(sessionStorage.getItem('cc_pending_submit') || 'null'); }catch(e){ stashed = null; }
  if(!stashed) return;
  try{ sessionStorage.removeItem('cc_pending_submit'); }catch(e){}
  await submitEntry(stashed.name, stashed.date, stashed.patch);
}
async function clearAthleteEntries(name){
  try{
    const res = await fetch('/api/clear-entries', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    if(DOC_STATE.entries) delete DOC_STATE.entries[name];
    return true;
  }catch(e){
    console.error('clear failed', e);
    showToast('Não deu para apagar agora. Tente de novo em instantes.');
    return false;
  }
}
function localStatusKey(){ return 'cc_status_'+STATE.currentAthlete+'_'+todayStr(); }
function markSubmittedToday(kind){
  try{
    const raw = localStorage.getItem(localStatusKey());
    const obj = raw ? JSON.parse(raw) : {};
    obj[kind] = true;
    localStorage.setItem(localStatusKey(), JSON.stringify(obj));
  }catch(e){ /* best-effort only */ }
}
function getSubmittedToday(){
  try{
    const raw = localStorage.getItem(localStatusKey());
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
/* ============================= DATE HELPERS ============================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function toDate(dstr){ const [y,m,d]=dstr.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function addDays(dstr, n){ const d=toDate(dstr); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function fmtShort(dstr){ const d=toDate(dstr); return d.getUTCDate().toString().padStart(2,'0')+'/'+(d.getUTCMonth()+1).toString().padStart(2,'0'); }
/* ============================= I18N (PT / RU — athlete-facing screens) ============================= */
const STR = {

  subtitle:{pt:'Questionário pré e pós-treino, carga aguda/crônica, ACWR, monotonia e strain — tudo num só lugar.', ru:'Анкета до и после тренировки, острая/хроническая нагрузка, ACWR, монотонность и strain — всё в одном месте.'},
  role1_title:{pt:'Sou atleta', ru:'Я игрок'},
  role1_desc:{pt:'Responder o questionário de hoje e ver meu status', ru:'Заполнить сегодняшнюю анкету и посмотреть свой статус'},

  password_ph:{pt:'Sua senha', ru:'Ваш пароль'},

  not_listed_hint:{pt:'Não está na lista ou esqueceu a senha? Fale com a comissão técnica.', ru:'Вас нет в списке или забыли пароль? Обратитесь к тренерскому штабу.'},
  back:{pt:'‹ Voltar', ru:'‹ Назад'},

  cancel:{pt:'‹ Cancelar', ru:'‹ Отмена'},
  fill_pre:{pt:'Preencher questionário pré-treino', ru:'Заполнить анкету до тренировки'},
  fill_post:{pt:'Registrar PSE / pós-treino de hoje', ru:'Внести PSE / после тренировки'},
  view_history:{pt:'Meu status de hoje', ru:'Мой статус сегодня'},
  today_date:{pt:'Data de hoje:', ru:'Сегодняшняя дата:'},

  fatigue_label:{pt:'Nível de cansaço', ru:'Уровень усталости'},
  fatigue_lo:{pt:'Nada cansado', ru:'Совсем не устал'}, fatigue_hi:{pt:'Exaustão total', ru:'Полное истощение'},
  pain_label:{pt:'Dor', ru:'Боль'},
  pain_lo:{pt:'Nenhuma dor', ru:'Нет боли'}, pain_hi:{pt:'Dor máxima', ru:'Максимальная боль'},
  pain_region_label:{pt:'Região da dor', ru:'Область боли'},
  front:{pt:'Frente', ru:'Спереди'}, back_view:{pt:'Costas', ru:'Сзади'},
  pick_region_hint:{pt:'Toque em uma ou mais regiões onde sentiu dor', ru:'Нажмите на одну или несколько областей, где чувствуете боль'},
  selected:{pt:'Selecionado: ', ru:'Выбрано: '},
  stress_label:{pt:'Estresse', ru:'Стресс'},
  stress_lo:{pt:'Nada estressado', ru:'Совсем не напряжён'}, stress_hi:{pt:'Extremamente estressado', ru:'Крайне напряжён'},

function buildDailyLoadSeries(entries, days){
  const map = {};
  entries.forEach(e=>{ if(e.load!=null) map[e.date] = (map[e.date]||0)+e.load; });
  const end = todayStr();
  const series = [];
  for(let i=days-1; i>=0; i--){
    const d = addDays(end, -i);
    series.push({date:d, load: map[d]||0});
  }
  return series;
}
function mean(arr){ return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function stdev(arr){ const m=mean(arr); if(arr.length<2) return 0; const v=mean(arr.map(x=>(x-m)*(x-m))); return Math.sqrt(v); }
function computeSeries(entries){
  const series = buildDailyLoadSeries(entries, 35);
  const out = [];
  for(let i=0;i<series.length;i++){
    const wk = series.slice(Math.max(0,i-6), i+1).map(s=>s.load);
    const mo = series.slice(Math.max(0,i-27), i+1).map(s=>s.load);
    const wkSum = wk.reduce((a,b)=>a+b,0);
    const acute = wkSum;
    const chronic = mo.reduce((a,b)=>a+b,0) / 4;
    const acwr = chronic>0 ? acute/chronic : null;
    const sd = stdev(wk);
    const monotony = sd>0 ? mean(wk)/sd : null;
    const strain = monotony!=null ? wkSum*monotony : null;
    out.push({date:series[i].date, load:series[i].load, acute, chronic, acwr, monotony, strain});
  }
  return out.slice(-28);
}
function acwrZone(v, lang){
  lang = lang||'pt';
  if(v==null) return {key:'none', label:STR.zone_none[lang], color:'var(--coldzone)'};
  if(v<0.8) return {key:'baixa', label:STR.zone_low[lang], color:'var(--coldzone)'};
  if(v<=1.3) return {key:'ideal', label:STR.zone_ideal[lang], color:'var(--zone-good)'};
  if(v<=1.5) return {key:'caution', label:STR.zone_caution[lang], color:'var(--amber)'};
  return {key:'alta', label:STR.zone_high[lang], color:'var(--flare)'};
}
function zonebarHtml(v, lang){
  lang = lang||'pt';
  const z = acwrZone(v, lang);
  const pct = v==null ? 0 : Math.min(Math.max(v,0), 2)/2*100;
  return `
    <div class="zonebar-wrap">
      <div class="zonebar">
        <div class="seg" style="width:40%; background:var(--coldzone);"></div>
        <div class="seg" style="width:25%; background:var(--zone-good);"></div>
        <div class="seg" style="width:10%; background:var(--amber);"></div>
        <div class="seg" style="width:25%; background:var(--flare);"></div>
        ${v!=null?`<div class="marker" style="left:${pct}%;"></div>`:''}
      </div>
      <div class="zonebar-val" style="color:${z.color}">${v==null?'—':v.toFixed(2)}</div>
      <div class="zonebar-lbl">${z.label}</div>
    </div>`;
}

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function init(){
  await loadDocState();
  STATE.roster = DOC_STATE.roster || [];
  STATE.staffRoster = DOC_STATE.staffRoster || [];
  if(!DOC_STATE.entries) DOC_STATE.entries = {};
  await recoverPendingSubmit();
  try{
    const savedStaff = sessionStorage.getItem('cc_staff_session');
    const savedAthlete = sessionStorage.getItem('cc_athlete_session');
    const savedLang = sessionStorage.getItem('cc_lang');
    if(savedLang==='pt' || savedLang==='ru') STATE.lang = savedLang;
    if(savedStaff && STATE.staffRoster.some(a=>a.name===savedStaff)){
      STATE.currentStaff = savedStaff; STATE.staffLoggedIn = true; STATE.screen = 'staff_dash';
    } else if(savedAthlete && STATE.roster.some(a=>a.name===savedAthlete)){
      STATE.currentAthlete = savedAthlete; STATE.screen = 'athlete_home';
    }
  }catch(e){}
  render();
}

}

/* ============================= ATHLETE: pre-training form ============================= */
function renderScale(name, min, max, current, labels){
  let btns='';
  for(let i=min;i<=max;i++){
    btns += `<button type="button" class="scale-btn ${current===i?'sel':''}" data-scale="${name}" data-val="${i}">${i}</button>`;
  }
  return `<div class="scale">${btns}</div>${labels?`<div class="scale-labels"><span>${labels[0]}</span><span>${labels[1]}</span></div>`:''}`;
}
let PRE_FORM = {sleep:null, fatigue:null, pain:null, stress:null};
function renderAthletePre(){
  const regions = STATE.bodyView==='frente' ? REGIONS_FRONT : REGIONS_BACK;
  const selectedIds = STATE.painRegions || [];
  const showRegionPicker = PRE_FORM.pain!=null && PRE_FORM.pain>0;
  return `
  <div class="topbar"><button class="back-btn" data-action="go-athlete-home">${t('cancel')}</button><div class="topbar-title">${t('pre_title')}</div><div style="width:50px"></div></div>
  <div class="screen">
    <div class="field">
      <label>${t('sleep_label')}</label>
      ${renderScale('sleep', 0, 10, PRE_FORM.sleep, [t('sleep_lo'),t('sleep_hi')])}
    </div>
    <div class="field">
      <label>${t('fatigue_label')}</label>
      ${renderScale('fatigue', 0, 10, PRE_FORM.fatigue, [t('fatigue_lo'),t('fatigue_hi')])}
    </div>
    <div class="field">
      <label>${t('pain_label')}</label>
      ${renderScale('pain', 0, 10, PRE_FORM.pain, [t('pain_lo'),t('pain_hi')])}
    </div>
    ${showRegionPicker ? `
    <div class="field">
      <label>${t('pain_region_label')}</label>

        <button type="button" class="${STATE.bodyView==='frente'?'sel':''}" data-action="body-view" data-view="frente">${t('front')}</button>
        <button type="button" class="${STATE.bodyView==='costas'?'sel':''}" data-action="body-view" data-view="costas">${t('back_view')}</button>
      </div>
      <div class="body-wrap">${bodySvg(regions, selectedIds, STATE.lang)}</div>

      ${renderScale('stress', 0, 10, PRE_FORM.stress, [t('stress_lo'),t('stress_hi')])}

    <button class="btn" data-action="submit-pre" style="margin-top:8px;">${t('submit_pre')}</button>
  </div>`;
}

/* ============================= CHARTS ============================= */
function chartAxisColors(){ return {grid:'rgba(243,239,228,0.08)', tick:'#AFC2B4'}; }
function buildLoadChart(canvasId, s, lang){
  lang = lang||'pt';
  const dailyLabel = lang==='ru' ? 'Дневная нагрузка' : 'Carga diária';
  const ctx = document.getElementById(canvasId);
  const cc = chartAxisColors();
  new Chart(ctx, {
    type:'bar',
    data:{
      labels: s.map(x=>fmtShort(x.date)),
      datasets:[
        {type:'bar', label:dailyLabel, data:s.map(x=>x.load), backgroundColor:'rgba(227,30,36,0.55)', yAxisID:'y'},
        {type:'line', label:'ACWR', data:s.map(x=>x.acwr), borderColor:'#E8B923', backgroundColor:'#E8B923', yAxisID:'y1', tension:0.25, pointRadius:2}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      scales:{
        x:{ticks:{color:cc.tick, maxRotation:0, autoSkip:true, maxTicksLimit:7}, grid:{display:false}},
        y:{position:'left', ticks:{color:cc.tick}, grid:{color:cc.grid}},
        y1:{position:'right', ticks:{color:'#E8B923'}, grid:{display:false}, min:0, suggestedMax:2}
      },
      plugins:{legend:{labels:{color:cc.tick, boxWidth:12, font:{size:11}}}}
    }
  });
}
function buildWellnessChart(canvasId, entries, lang){
  lang = lang||'pt';
  const L = lang==='ru' ? {sleep:'Сон', fatigue:'Усталость', stress:'Стресс'} : {sleep:'Sono', fatigue:'Cansaço', stress:'Estresse'};
  const ctx = document.getElementById(canvasId);
  const cc = chartAxisColors();
  const sorted = [...entries].sort((a,b)=>a.date.localeCompare(b.date)).slice(-28);
  new Chart(ctx, {
    type:'line',
    data:{
      labels: sorted.map(e=>fmtShort(e.date)),
      datasets:[
        {label:L.sleep, data:sorted.map(e=>e.sleep), borderColor:'#3C6B8C', tension:0.25, pointRadius:2},
        {label:L.fatigue, data:sorted.map(e=>e.fatigue), borderColor:'#E8B923', tension:0.25, pointRadius:2},
        {label:L.stress, data:sorted.map(e=>e.stress), borderColor:'#B0201F', tension:0.25, pointRadius:2},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ticks:{color:cc.tick, maxRotation:0, autoSkip:true, maxTicksLimit:7}, grid:{display:false}},
        y:{min:0, max:10, ticks:{color:cc.tick}, grid:{color:cc.grid}}
      },
      plugins:{legend:{labels:{color:cc.tick, boxWidth:12, font:{size:11}}}}
    }
  });
}
/* ============================= STAFF: dashboard ============================= */
function summarize(name, entries){
  const s = computeSeries(entries);
  const last = s[s.length-1];
  const todayEntry = entries.find(e=>e.date===todayStr());
  // ACWR needs some history to mean anything — with 1-2 days of data the chronic (28d) average
  // is mostly zeros, so acute/chronic comes out inflated and flags a false "risco alto". Below a
  // week of entries we show a neutral "sem dado" state instead of a color-coded risk zone.
  const reliable = entries.length >= 7;
  return {name, entries, series:s, last, todayEntry, reliable};
}
let STAFF_SUMMARIES = [];
function renderStaffDash(){
  return `
  <div class="dash">
    <div class="topbar dark"><button class="back-btn" data-action="go-landing">‹ Sair</button><div class="topbar-title">Painel do elenco</div><button class="back-btn" data-action="go-staff-manage">Elenco</button></div>
    <div class="hint" style="padding:0 16px; color:var(--text-on-dark-dim);">Logado como ${STATE.currentStaff||''} · <button class="back-btn" style="display:inline; padding:0;" data-action="go-change-password">trocar minha senha</button></div>
    <div class="dash-body" id="staff-dash-body">Carregando…</div>
  </div>`;
}
async function loadStaffDash(){
  if(!document.getElementById('staff-dash-body')) return;
  await refreshDocState();
  const body = document.getElementById('staff-dash-body');
  if(!body || STATE.screen!=='staff_dash') return; // navigated away while the fetch was in flight
  if(!STATE.roster.length){
    body.innerHTML = `<div class="empty">Nenhum atleta cadastrado ainda. Toque em "Elenco" para adicionar.</div>`;
    return;
  }
  const byAthlete = DOC_STATE.entries || {};
  STAFF_SUMMARIES = STATE.roster.map(a=>summarize(a.name, byAthlete[a.name]||[]));
  const alta = STAFF_SUMMARIES.filter(s=>s.reliable && s.last && s.last.acwr!=null && s.last.acwr>1.5).length;
  const caution = STAFF_SUMMARIES.filter(s=>s.reliable && s.last && s.last.acwr!=null && s.last.acwr>1.3 && s.last.acwr<=1.5).length;
  const semDado = STAFF_SUMMARIES.filter(s=>!s.entries.length).length;
  const cards = STAFF_SUMMARIES.map(s=>{
    const painToday = s.todayEntry && s.todayEntry.dor>0;
    const sleepLow = s.todayEntry && s.todayEntry.sleep!=null && s.todayEntry.sleep<=4;
    let tags = '';
    if(!s.entries.length) tags += `<span class="tag nodata">sem dados</span>`;
    else if(!s.reliable) tags += `<span class="tag nodata">poucos dados</span>`;
    if(painToday) tags += `<span class="tag pain">dor hoje</span>`;
    if(sleepLow) tags += `<span class="tag sleep">sono baixo</span>`;
    return `
    <div class="player-card" data-action="open-staff-detail" data-name="${s.name}">
      <div class="player-name"><div class="n">${s.name}</div><div class="tags">${tags}</div></div>
      ${zonebarHtml(s.reliable && s.last ? s.last.acwr : null)}
    </div>`;
  }).join('');
  body.innerHTML = `
    <div class="dash-summary">
      <div class="sum-chip risk-alta"><div class="n">${alta}</div><div class="l">Risco alto</div></div>
      <div class="sum-chip risk-caution"><div class="n">${caution}</div><div class="l">Atenção</div></div>
      <div class="sum-chip"><div class="n">${semDado}</div><div class="l">Sem dados</div></div>
    </div>
    <div class="roster-grid">${cards}</div>`;
  attachHandlers(); // cards above were injected after the initial render() pass, so they need their own click binding
}
/* ============================= STAFF: manage roster ============================= */

    <label style="display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-on-light-dim); margin-bottom:10px;">Atletas (${STATE.roster.length})</label>

      <input type="password" id="new-roster-pass" placeholder="Criar/redefinir senha" style="margin-bottom:8px;">
      <input type="password" id="new-roster-pass2" placeholder="Confirmar senha" style="margin-bottom:10px;">
      <button class="btn small" data-action="add-athlete-staff">Salvar</button>
    </div>
    <label style="display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-on-light-dim); margin:26px 0 10px;">Comissão técnica (${STATE.staffRoster.length})</label>
    <div class="manage-list">${staffItems}</div>
    <div class="field">
      <label>Adicionar membro (se o nome já existir, isso redefine a senha dele)</label>
      <input type="text" id="new-staff-name" placeholder="Nome completo" style="margin-bottom:8px;">
      <input type="password" id="new-staff-pass" placeholder="Criar/redefinir senha" style="margin-bottom:8px;">
      <input type="password" id="new-staff-pass2" placeholder="Confirmar senha" style="margin-bottom:10px;">
      <button class="btn small" data-action="add-staff-member">Salvar</button>
    </div>
    <div class="hint">Essas mudanças ficam salvas no próprio artefato publicado. Você precisa ter permissão de edição neste link para que "Salvar" funcione.</div>
  </div>`;
}
/* ============================= STAFF: athlete detail ============================= */
function renderStaffDetail(){
  return `
  <div class="dash">
    <div class="topbar dark"><button class="back-btn" data-action="go-staff">‹ Elenco</button><div class="topbar-title">${STATE.staffDetailAthlete}</div><div style="width:50px"></div></div>
    <div id="staff-detail-body" class="detail-hero" style="padding-bottom:40px;">Carregando…</div>

}
async function drawStaffDetailCharts(){
  const name = STATE.staffDetailAthlete;
  if(!document.getElementById('staff-detail-body')) return;
  await refreshDocState();
  const host = document.getElementById('staff-detail-body');

    </div>

}
/* ============================= EVENT HANDLING ============================= */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = onAction;
  });
  document.querySelectorAll('.scale-btn').forEach(el=>{
    el.onclick = ()=>{
      const name = el.getAttribute('data-scale');
      const val = parseInt(el.getAttribute('data-val'));
      if(name==='pse') POST_FORM.pse = val; else PRE_FORM[name] = val;
      if(name==='pain' && val===0) STATE.painRegions = [];
      render();
    };
  });
  document.querySelectorAll('.zone').forEach(el=>{
    el.onclick = ()=>{
      const region = el.getAttribute('data-region');
      const idx = STATE.painRegions.indexOf(region);
      if(idx>=0) STATE.painRegions.splice(idx,1);
      else STATE.painRegions.push(region);
      render();
    };
  });
  const durationInput = document.getElementById('duration-input');
  if(durationInput){
    const updatePreview = ()=>{
      POST_FORM.duration = durationInput.value;
      const pv = document.getElementById('load-preview');
      if(POST_FORM.pse!=null && POST_FORM.duration){
        const val = (POST_FORM.pse*parseFloat(POST_FORM.duration)).toFixed(0);
        pv.textContent = STATE.lang==='ru'
          ? 'Нагрузка = PSE (' + POST_FORM.pse + ') × ' + POST_FORM.duration + ' мин = ' + val
          : 'Carga da sessão = PSE (' + POST_FORM.pse + ') × ' + POST_FORM.duration + ' min = ' + val;
      } else { pv.textContent=''; }
    };
    durationInput.oninput = updatePreview;
    updatePreview();
  }
}
async function onAction(e){
  const action = e.currentTarget.getAttribute('data-action');
  if(action==='go-landing'){
    PRE_FORM={sleep:null,fatigue:null,pain:null,stress:null}; STATE.painRegions=[]; POST_FORM={pse:null,duration:''};
    STATE.currentAthlete=null; STATE.currentStaff=null; STATE.staffLoggedIn=false;
    clearSessions();
    go('landing');
  }
  else if(action==='go-athlete-select') go('athlete_select');
  else if(action==='go-staff-gate') go('staff_gate');
  else if(action==='go-staff') go('staff_dash');
  else if(action==='go-staff-manage'){ await refreshDocState(); go('staff_manage'); }
  else if(action==='go-athlete-home') go('athlete_home');
  else if(action==='go-athlete-pre'){ PRE_FORM={sleep:null,fatigue:null,pain:null,stress:null}; STATE.painRegions=[]; go('athlete_pre'); }
  else if(action==='go-athlete-post'){ POST_FORM={pse:null,duration:''}; go('athlete_post'); }
  else if(action==='go-athlete-history') go('athlete_history');
  else if(action==='go-change-password') go('change_password');
  else if(action==='submit-change-password'){
    const p1 = document.getElementById('own-new-pass').value;
    const p2 = document.getElementById('own-new-pass2').value;
    if(!p1 || p1.length<4){ showToast(t('password_too_short_toast')); return; }
    if(p1!==p2){ showToast(t('password_mismatch_toast')); return; }
    const hash = await hashPassword(p1);
    if(STATE.staffLoggedIn){
      const member = STATE.staffRoster.find(a=>a.name===STATE.currentStaff);
      if(member) member.hash = hash;
      DOC_STATE.staffRoster = STATE.staffRoster;
    } else {
      const athlete = STATE.roster.find(a=>a.name===STATE.currentAthlete);
      if(athlete) athlete.hash = hash;
      DOC_STATE.roster = STATE.roster;
    }
    const ok = await publishDocState();
    if(ok){ showToast(t('password_changed_toast')); go(STATE.staffLoggedIn ? 'staff_dash' : 'athlete_home'); }
    else showToast('Não deu para salvar agora. Tente de novo em instantes.');
  }
  else if(action==='body-view'){ STATE.bodyView = e.currentTarget.getAttribute('data-view'); render(); }
  else if(action==='set-lang'){ STATE.lang = e.currentTarget.getAttribute('data-lang'); saveLang(STATE.lang); render(); }
  else if(action==='confirm-athlete-select'){
    const sel = document.getElementById('sel-athlete-name').value;
    const pass = document.getElementById('athlete-password').value;
    if(!sel){ showToast(t('choose_name_toast')); return; }
    if(!pass){ showToast(t('type_password_toast')); return; }
    const athlete = STATE.roster.find(a=>a.name===sel);
    if(!athlete || !athlete.hash){ showToast(t('no_password_toast')); return; }
    const hash = await hashPassword(pass);
    if(hash !== athlete.hash){ showToast(t('wrong_password_toast')); return; }
    STATE.currentAthlete = sel;
    saveAthleteSession(sel);
    go('athlete_home');
  }
  else if(action==='add-athlete-staff'){
    const nameEl = document.getElementById('new-roster-name');
    const pass1 = document.getElementById('new-roster-pass').value;
    const pass2 = document.getElementById('new-roster-pass2').value;
    const val = nameEl.value.trim();
    if(!val){ showToast('Digite o nome do atleta'); return; }
    if(!pass1 || pass1.length<4){ showToast('A senha precisa ter pelo menos 4 caracteres'); return; }
    if(pass1!==pass2){ showToast('As senhas não coincidem'); return; }
    const hash = await hashPassword(pass1);
    const existing = STATE.roster.find(a=>a.name===val);
    if(existing){ existing.hash = hash; }
    else { STATE.roster.push({name:val, hash}); }
    DOC_STATE.roster = STATE.roster;
    const ok = await publishDocState();
    if(ok) showToast(existing?'Senha redefinida ✓':'Atleta adicionado ✓');
    go('staff_manage');
  }
  else if(action==='remove-athlete'){
    const name = e.currentTarget.getAttribute('data-name');
    STATE.roster = STATE.roster.filter(a=>a.name!==name);
    DOC_STATE.roster = STATE.roster;
    await publishDocState();
    go('staff_manage');
  }
  else if(action==='clear-athlete-entries'){
    const name = e.currentTarget.getAttribute('data-name');
    const ok = await clearAthleteEntries(name);
    if(ok) showToast('Dados de ' + name + ' apagados ✓');
    go('staff_manage');
  }
  else if(action==='staff-setup-submit'){
    const name = document.getElementById('staff-setup-name').value.trim();
    const pass1 = document.getElementById('staff-setup-pass').value;
    const pass2 = document.getElementById('staff-setup-pass2').value;
    if(!name){ showToast('Digite seu nome'); return; }
    if(!pass1 || pass1.length<4){ showToast('A senha precisa ter pelo menos 4 caracteres'); return; }
    if(pass1!==pass2){ showToast('As senhas não coincidem'); return; }
    const hash = await hashPassword(pass1);
    STATE.staffRoster.push({name, hash});
    DOC_STATE.staffRoster = STATE.staffRoster;
    STATE.currentStaff = name; STATE.staffLoggedIn = true;
    saveStaffSession(name); // stashed before publish: a reload mid-publish should not cost this login
    await publishDocState();
    go('staff_dash');
  }
  else if(action==='staff-login-submit'){
    const sel = document.getElementById('sel-staff-name').value;
    const pass = document.getElementById('staff-password').value;
    if(!sel){ showToast('Escolha um nome na lista'); return; }
    if(!pass){ showToast('Digite sua senha'); return; }
    const member = STATE.staffRoster.find(a=>a.name===sel);
    if(!member || !member.hash){ showToast('Essa conta ainda não tem senha configurada.'); return; }
    const hash = await hashPassword(pass);
    if(hash !== member.hash){ showToast('Senha incorreta'); return; }
    STATE.currentStaff = sel; STATE.staffLoggedIn = true;
    saveStaffSession(sel);
    go('staff_dash');
  }
  else if(action==='add-staff-member'){
    const nameEl = document.getElementById('new-staff-name');
    const pass1 = document.getElementById('new-staff-pass').value;
    const pass2 = document.getElementById('new-staff-pass2').value;
    const val = nameEl.value.trim();
    if(!val){ showToast('Digite o nome'); return; }
    if(!pass1 || pass1.length<4){ showToast('A senha precisa ter pelo menos 4 caracteres'); return; }
    if(pass1!==pass2){ showToast('As senhas não coincidem'); return; }
    const hash = await hashPassword(pass1);
    const existing = STATE.staffRoster.find(a=>a.name===val);
    if(existing){ existing.hash = hash; }
    else { STATE.staffRoster.push({name:val, hash}); }
    DOC_STATE.staffRoster = STATE.staffRoster;
    const ok = await publishDocState();
    if(ok) showToast(existing?'Senha redefinida ✓':'Membro adicionado ✓');
    go('staff_manage');
  }
  else if(action==='remove-staff-member'){
    const name = e.currentTarget.getAttribute('data-name');
    STATE.staffRoster = STATE.staffRoster.filter(a=>a.name!==name);
    DOC_STATE.staffRoster = STATE.staffRoster;
    await publishDocState();
    go('staff_manage');
  }
  else if(action==='submit-pre'){
    if(PRE_FORM.sleep==null || PRE_FORM.fatigue==null || PRE_FORM.pain==null || PRE_FORM.stress==null){
      showToast(t('fill_all_pre_toast')); return;
    }
    const regiaoLabel = (PRE_FORM.pain>0 && STATE.painRegions.length)
      ? STATE.painRegions.map(id=>regionLabel(id, STATE.lang)).join(', ') : null;
    const patch = {
      sleep: PRE_FORM.sleep, fatigue: PRE_FORM.fatigue, dor: PRE_FORM.pain,
      dorRegiao: regiaoLabel ? {label: regiaoLabel} : null, stress: PRE_FORM.stress
    };
    const ok = await submitEntry(STATE.currentAthlete, todayStr(), patch);
    if(ok){ markSubmittedToday('pre'); showToast(t('sent_pre_toast')); go('athlete_home'); }
    else showToast('Não deu para enviar agora. Tente de novo em instantes.');
  }
  else if(action==='submit-post'){
    if(POST_FORM.pse==null || !POST_FORM.duration){
      showToast(t('fill_post_toast')); return;
    }
    const duration = parseFloat(POST_FORM.duration);
    const load = POST_FORM.pse * duration;
    const patch = { pse: POST_FORM.pse, duration: duration, load: load };
    const ok = await submitEntry(STATE.currentAthlete, todayStr(), patch);
    if(ok){ markSubmittedToday('pos'); showToast(t('saved_post_toast')); go('athlete_home'); }
    else showToast('Não deu para enviar agora. Tente de novo em instantes.');
  }
  else if(action==='open-staff-detail'){
    STATE.staffDetailAthlete = e.currentTarget.getAttribute('data-name');
    go('staff_detail');
  }
}
init();
</script>
